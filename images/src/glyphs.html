<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
html { background-color: #1d2230; }
body { background-color: #1d2230; color: #e5e9f0; padding: 64px 100px; font-family: "Iosevka SemiExtended", monospace; }
h2 { font-size: 40px; font-weight: 700; margin-bottom: 34px; }
.grid { display: grid; grid-template-columns: 190px minmax(0, 1fr) minmax(0, 1fr); column-gap: 40px; row-gap: 26px; align-items: baseline; }
.head { align-self: end; }
.head .name { font-size: 26px; font-weight: 700; color: #e5e9f0; }
.head .note { font-size: 18px; color: #9aa7bd; margin-top: 2px; }
.lab { font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: #88c0d0; font-family: "Iosevka SemiExtended", monospace; }
.t { font-size: 38px; line-height: 1.3; color: #d8dee9; white-space: nowrap; }
.ss14 { font-family: "Iosevka SemiExtended SS14", monospace; }
.rule { grid-column: 1 / -1; border-top: 1px solid #343c52; margin: 4px 0 2px; }
</style>
<h2>Character set</h2>
<div class="grid" id="grid"></div>
<script>
const rows = [
  ['Uppercase', 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'],
  ['Lowercase', 'abcdefghijklmnopqrstuvwxyz'],
  ['Numerals', '0123456789 ¼ ½ ¾ ² ³'],
  ['Punctuation', '!?.,:;&amp;@#$%*+-=/\\|~^_`\'"'],
  ['Accented', 'àéîõü ñçø ÅÆŒ ŁŠŽ ğş'],
  ['Greek &amp; Cyrillic', 'αβγδ ΩΣΔ ЖДЯ жфю'],
  ['Ligatures', '-&gt; =&gt; &lt;= &gt;= != === &amp;&amp; ||'],
];
let h = '<div></div>' +
  '<div class="head"><div class="name">Iosevka SemiExtended</div><div class="note">The release Iosevka design</div></div>' +
  '<div class="head ss14"><div class="name">Iosevka SemiExtended SS14</div><div class="note">JetBrains Mono style</div></div>' +
  '<div class="rule"></div>';
for (const [lab, text] of rows) {
  h += '<div class="lab">' + lab + '</div><div class="t">' + text + '</div><div class="t ss14">' + text + '</div>';
}
document.getElementById('grid').innerHTML = h;
</script>
