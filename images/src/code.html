<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
:root { --bg:#242933; --win:#2e3440; --bar:#272c36; --line:#3b4252; --fg:#d8dee9; --dim:#97a3ba; --kw:#81a1c1; --fn:#88c0d0; --str:#a3be8c; --num:#b48ead; --ty:#8fbcbb; --cm:#97a3ba; --op:#81a1c1; --ln:#8490a8; --sel:#343b49; }
:root.light { --bg:#e8ecf3; --win:#ffffff; --bar:#f1f3f8; --line:#dfe3ec; --fg:#2e3440; --dim:#5f6a83; --kw:#4c6f9a; --fn:#2a7389; --str:#4d7a30; --num:#8a5a8e; --ty:#37736f; --cm:#5f6a83; --op:#4c6f9a; --ln:#7c869b; --sel:#f1f4f9; }
body { background: var(--bg); padding: 0 110px; display: flex; align-items: center; }
.win { background: var(--win); border-radius: 18px; box-shadow: 0 30px 70px rgba(0,0,0,.35), 0 0 0 1px var(--line); overflow: hidden; width: 100%; }
.bar { background: var(--bar); display: flex; align-items: center; padding: 17px 22px; border-bottom: 1px solid var(--line); }
.dots { display: flex; gap: 10px; }
.dots b { width: 14px; height: 14px; border-radius: 50%; display: block; background: #ff5f57; }
.dots b:nth-child(2) { background: #febc2e; }
.dots b:nth-child(3) { background: #28c840; }
.title { flex: 1; text-align: center; font-size: 17px; color: var(--dim); margin-right: 60px; }
.pane { position: relative; font-family: "Iosevka SemiExtended", monospace; }
.pane + .pane { border-top: 1px solid var(--line); }
.pane.ss14 { font-family: "Iosevka SemiExtended SS14", monospace; }
.tag { position: absolute; top: 16px; right: 28px; font-size: 17px; color: var(--dim); }
pre { font: inherit; font-size: 32px; line-height: 1.6; padding: 22px 0; color: var(--fg); }
.l { display: block; padding: 0 36px 0 0; white-space: pre; }
.l.cur { background: var(--sel); }
.n { display: inline-block; width: 96px; text-align: right; padding-right: 34px; color: var(--ln); }
.k { color: var(--kw); } .f { color: var(--fn); } .s { color: var(--str); } .d { color: var(--num); }
.t { color: var(--ty); } .c { color: var(--cm); font-style: italic; } .o { color: var(--op); }
</style>
<script>if (location.hash === '#light') document.documentElement.className = 'light';</script>
<div class="win">
  <div class="bar"><div class="dots"><b></b><b></b><b></b></div><div class="title">cart.ts</div></div>
  <div class="pane" id="stock"><div class="tag">Iosevka SemiExtended</div><pre></pre></div>
  <div class="pane ss14" id="ss14"><div class="tag">Iosevka SemiExtended SS14</div><pre></pre></div>
</div>
<script>
// {{class:text}} marks a highlighted span; text is HTML.
const lines = [
  '{{c:// Totals are in cents.}}',
  '{{k:export function}} {{f:total}}({{t:items}}: {{t:Item}}[], {{t:taxRate}} = {{d:0.0825}}): {{t:number}} {',
  '  {{k:if}} (items.length {{o:!==}} {{d:1}} {{o:&amp;&amp;}} taxRate {{o:&gt;=}} {{d:1}}) {{k:return}} {{d:0}};',
  '  {{k:return}} items.{{f:reduce}}((sum, i) {{o:=&gt;}} sum {{o:+}} i.cents {{o:*}} i.qty, {{d:0}});',
  '}',
];
const cur = 2;
const html = lines.map((raw, i) =>
  '<span class="l' + (i === cur ? ' cur' : '') + '"><span class="n">' + (i + 1) + '</span>' +
  raw.replace(/\{\{(\w):(.*?)\}\}/g, '<span class="$1">$2</span>') + '</span>').join('');
document.querySelectorAll('.pane pre').forEach(p => p.innerHTML = html);
</script>
